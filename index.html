<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockFácil - Control de Inventario</title>
  <!-- Vinculamos nuestra hoja de estilos local -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado principal de la aplicación -->
  <header class="app-header">
    <h1>StockFácil</h1>
    <p>Sistema de gestión y control de inventario</p>
  </header>

  <main class="container">
    
    <!-- Sección del formulario para registrar y editar productos -->
    <section class="card">
      <h2>Registro de Producto</h2>
      <form id="product-form">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="nombre">Nombre del producto *</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Teclado Mecánico">
          </div>

          <div class="form-group">
            <label for="sku">Código (SKU) *</label>
            <input type="text" id="sku" name="sku" required placeholder="Ej. TEC-001">
          </div>

          <div class="form-group">
            <label for="categoria">Categoría *</label>
            <select id="categoria" name="categoria" required>
              <option value="">Seleccione una categoría...</option>
              <option value="Electrónica">Electrónica</option>
              <option value="Oficina">Oficina</option>
              <option value="Hogar">Hogar</option>
              <option value="Alimentos">Alimentos</option>
              <option value="Otros">Otros</option>
            </select>
          </div>

          <div class="form-group">
            <label for="stock">Cantidad en stock *</label>
            <input type="number" id="stock" name="stock" min="0" required placeholder="0">
          </div>

          <div class="form-group">
            <label for="stockMinimo">Stock mínimo *</label>
            <input type="number" id="stockMinimo" name="stockMinimo" min="0" required placeholder="0">
          </div>

          <div class="form-group">
            <label for="precio">Precio unitario ($) *</label>
            <input type="number" id="precio" name="precio" min="0" step="0.01" required placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="proveedor">Proveedor</label>
            <input type="text" id="proveedor" name="proveedor" placeholder="Nombre del proveedor">
          </div>

          <div class="form-group">
            <label for="fechaIngreso">Fecha de ingreso *</label>
            <input type="date" id="fechaIngreso" name="fechaIngreso" required>
          </div>

          <div class="form-group full-width">
            <label for="notas">Notas adicionales</label>
            <textarea id="notas" name="notas" rows="3" placeholder="Detalles, ubicación en almacén, observaciones..."></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Guardar Producto</button>
          <button type="reset" class="btn-secondary">Limpiar</button>
        </div>
      </form>
    </section>

    <!-- Sección de la tabla donde se listan los productos -->
    <section class="card">
      <h2>Inventario Actual</h2>
      <div class="table-responsive">
        <table id="inventory-table">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Stock</th>
              <th>Stock Mín.</th>
              <th>Precio Unit.</th>
              <th>Proveedor</th>
              <th>Fecha Ingreso</th>
              <th>Notas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <!-- El cuerpo de la tabla se pobla dinámicamente desde app.js -->
          <tbody id="inventory-tbody">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modal de confirmación personalizado para eliminar productos -->
  <div id="delete-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h3 id="delete-modal-title">Confirmar eliminación</h3>
      <p id="delete-modal-message"></p>
      <div class="modal-actions">
        <button type="button" id="btn-cancel-delete" class="btn-secondary">Cancelar</button>
        <button type="button" id="btn-confirm-delete" class="btn-danger">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Cargamos el script principal al final del body para asegurar que el DOM esté listo -->
  <script src="app.js"></script>
</body>
</html>
